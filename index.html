<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vibes">
<meta name="description" content="Tu reproductor de música personal">
<title>Vibes — Player</title>
<link rel="manifest" id="manifest-placeholder">

<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --accent: #a259ff;
  --accent2: #6c2bd9;
  --bg: #080810;
  --surface: #11111c;
  --surface2: #1a1a2a;
  --border: rgba(255,255,255,0.07);
  --text: #f0eeff;
  --muted: rgba(240,238,255,0.38);
  --hint: rgba(240,238,255,0.18);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
  user-select: none;
}

/* ── LAYOUT ── */
#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Ambient glow behind cover */
#glow {
  position: fixed;
  width: 340px; height: 340px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.12;
  filter: blur(90px);
  top: -60px; left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  transition: background 1.2s ease;
  z-index: 0;
}

/* ── TOP BAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.25rem 0.5rem;
  z-index: 10;
  flex-shrink: 0;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text);
}

.topbar-actions { display: flex; gap: 10px; align-items: center; }

.icon-btn {
  background: var(--surface2);
  border: 0.5px solid var(--border);
  color: var(--muted);
  width: 38px; height: 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
  flex-shrink: 0;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn.accent { color: var(--accent); border-color: rgba(162,89,255,0.3); }

/* ── TABS ── */
.tabs {
  display: flex;
  gap: 0;
  padding: 0.75rem 1.25rem 0;
  z-index: 10;
  flex-shrink: 0;
}

.tab {
  flex: 1;
  padding: 8px 0;
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 1.5px solid var(--border);
  transition: color 0.2s, border-color 0.2s;
  letter-spacing: 0.5px;
}
.tab.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}

/* ── PAGES ── */
.page { display: none; flex: 1; overflow-y: auto; overflow-x: hidden; }
.page.active { display: flex; flex-direction: column; }
.page::-webkit-scrollbar { display: none; }

/* ── NOW PLAYING ── */
#page-player {
  align-items: center;
  padding: 1.25rem 1.5rem 1.5rem;
  gap: 0;
  justify-content: space-between;
}

.cover-wrap {
  position: relative;
  width: min(220px, 55vw);
  height: min(220px, 55vw);
  flex-shrink: 0;
  margin: 0.5rem 0 1rem;
}

.cover-art {
  width: 100%; height: 100%;
  border-radius: 22px;
  background: linear-gradient(135deg, #1a1a2e, #6c2bd9);
  display: flex; align-items: center; justify-content: center;
  font-size: min(72px, 18vw);
  position: relative;
  overflow: hidden;
  transition: background 0.8s ease;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}

.cover-art::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 22px;
  border: 1.5px solid rgba(255,255,255,0.12);
}

@keyframes cover-pulse {
  0%,100% { box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 0 rgba(162,89,255,0.0); }
  50%      { box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 14px rgba(162,89,255,0.12); }
}
.cover-art.playing { animation: cover-pulse 2.4s ease-in-out infinite; }

.fav-btn {
  position: absolute;
  top: 10px; right: 10px;
  background: rgba(0,0,0,0.4);
  border: none;
  color: var(--muted);
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 16px;
  transition: color 0.2s;
}
.fav-btn.active { color: #ff4f6d; }

.track-meta {
  width: 100%;
  text-align: center;
  padding: 0 0.5rem;
}

.track-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(17px, 4.5vw, 22px);
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}

.track-artist {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Progress */
.progress-section { width: 100%; padding: 0.25rem 0; }

.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--hint);
  margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
}

.progress-track {
  width: 100%;
  height: 4px;
  background: var(--surface2);
  border-radius: 4px;
  cursor: pointer;
  position: relative;
  touch-action: none;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  border-radius: 4px;
  width: 0%;
  position: relative;
  pointer-events: none;
}

.progress-thumb {
  position: absolute;
  right: -6px; top: 50%;
  transform: translateY(-50%);
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 6px rgba(162,89,255,0.7);
  opacity: 0;
  transition: opacity 0.2s;
}
.progress-track:hover .progress-thumb,
.progress-track.dragging .progress-thumb { opacity: 1; }

/* Controls */
.controls-main {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(16px, 5vw, 28px);
  width: 100%;
}

.ctrl {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 8px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.2s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.ctrl:active { transform: scale(0.88); }
.ctrl:hover { color: var(--text); }
.ctrl.on { color: var(--accent); }

.play-pause {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  border: none;
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 28px rgba(162,89,255,0.45);
  transition: transform 0.15s, box-shadow 0.15s;
  flex-shrink: 0;
}
.play-pause:active { transform: scale(0.93); box-shadow: 0 4px 16px rgba(162,89,255,0.35); }

/* Volume */
.volume-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.vol-label { color: var(--hint); display: flex; }

input[type=range].vol {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  border-radius: 4px;
  background: var(--surface2);
  outline: none;
  cursor: pointer;
  accent-color: var(--accent);
}
input[type=range].vol::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 0 4px rgba(162,89,255,0.5);
}

/* ── QUEUE PAGE ── */
#page-queue { padding: 1rem 1.25rem; gap: 0.75rem; }

.queue-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.25rem 0;
}

.queue-label {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}

.queue-count { font-size: 12px; color: var(--hint); }

.queue-scroll { display: flex; flex-direction: column; gap: 3px; }

.track-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 14px;
  cursor: pointer;
  transition: background 0.15s;
  border: 0.5px solid transparent;
}
.track-row:active { transform: scale(0.98); }
.track-row:hover { background: var(--surface2); }
.track-row.active {
  background: rgba(162,89,255,0.1);
  border-color: rgba(162,89,255,0.2);
}

.track-mini-art {
  width: 44px; height: 44px;
  border-radius: 10px;
  background: linear-gradient(135deg, #1a1a2e, #6c2bd9);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  transition: background 0.6s;
}

.track-row-info { flex: 1; overflow: hidden; }
.track-row-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track-row.active .track-row-name { color: var(--accent); }
.track-row-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-row-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.track-dur { font-size: 11px; color: var(--hint); font-variant-numeric: tabular-nums; }

.bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 16px;
}
.bars span {
  width: 3px;
  background: var(--accent);
  border-radius: 2px;
  animation: bar 0.8s ease-in-out infinite;
}
.bars span:nth-child(1) { animation-delay: 0s; }
.bars span:nth-child(2) { animation-delay: 0.15s; }
.bars span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bar { 0%,100%{height:3px} 50%{height:14px} }

/* Empty state */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 2rem;
  gap: 1rem;
  text-align: center;
}
.empty-icon { font-size: 48px; opacity: 0.5; }
.empty-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: var(--muted); }
.empty-sub { font-size: 13px; color: var(--hint); line-height: 1.6; }

.upload-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  color: #fff;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(162,89,255,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
  border: none;
}
.upload-pill:active { transform: scale(0.96); box-shadow: 0 3px 12px rgba(162,89,255,0.3); }

/* Upload zone in queue */
.drop-zone {
  border: 1.5px dashed rgba(162,89,255,0.25);
  border-radius: 14px;
  padding: 1rem;
  text-align: center;
  cursor: pointer;
  font-size: 12px;
  color: var(--hint);
  transition: border-color 0.2s, background 0.2s;
  margin-top: 0.5rem;
}
.drop-zone:hover { border-color: var(--accent); background: rgba(162,89,255,0.05); color: var(--muted); }

/* ── BOTTOM NAV ── */
.bottom-nav {
  display: flex;
  background: rgba(8,8,16,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--border);
  padding: 10px 0 max(10px, env(safe-area-inset-bottom));
  z-index: 20;
  flex-shrink: 0;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 4px 0;
  color: var(--muted);
  transition: color 0.2s;
  font-size: 10px;
  letter-spacing: 0.5px;
}
.nav-item.active { color: var(--accent); }
.nav-item svg { width: 22px; height: 22px; }

/* ── INSTALL BANNER ── */
#install-banner {
  display: none;
  align-items: center;
  justify-content: space-between;
  background: rgba(162,89,255,0.12);
  border: 0.5px solid rgba(162,89,255,0.3);
  margin: 0.75rem 1.25rem 0;
  border-radius: 14px;
  padding: 10px 14px;
  gap: 10px;
  z-index: 10;
  flex-shrink: 0;
}
#install-banner.show { display: flex; }

.banner-text { font-size: 12px; color: var(--text); flex: 1; line-height: 1.4; }
.banner-text strong { color: var(--accent); }

.banner-install {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}

.banner-close {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 2px;
  flex-shrink: 0;
}

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface2);
  border: 0.5px solid var(--border);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 50px;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  white-space: nowrap;
  z-index: 100;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── DESKTOP ADAPTATIONS ── */
@media (min-width: 600px) {
  #page-player { padding: 2rem 2.5rem; max-width: 480px; margin: 0 auto; width: 100%; }
  .cover-wrap { width: 260px; height: 260px; }
  .cover-art { border-radius: 28px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- Ambient glow -->
  <div id="glow"></div>

  <!-- Install banner (Android/Desktop) -->
  <div id="install-banner">
    <div class="banner-text"><strong>Instalar Vibes</strong><br>Agrégala a tu pantalla de inicio</div>
    <button class="banner-install" id="install-btn">Instalar</button>
    <button class="banner-close" id="banner-close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- Top bar -->
  <div class="topbar">
    <div class="logo">Vibes</div>
    <div class="topbar-actions">
      <label class="icon-btn" for="file-input" title="Subir música">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </label>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-page="player">Reproduciendo</div>
    <div class="tab" data-page="queue">Cola</div>
  </div>

  <!-- Page: Now Playing -->
  <div class="page active" id="page-player">
    <div class="cover-wrap">
      <div class="cover-art" id="cover-art">
        <span id="cover-emoji">🎵</span>
      </div>
      <button class="fav-btn" id="fav-btn">♡</button>
    </div>

    <div class="track-meta">
      <div class="track-title" id="track-title">Sin música</div>
      <div class="track-artist" id="track-artist">Sube tus MP3s para empezar</div>
    </div>

    <div class="progress-section">
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-tot">0:00</span>
      </div>
      <div class="progress-track" id="prog-track">
        <div class="progress-fill" id="prog-fill">
          <div class="progress-thumb"></div>
        </div>
      </div>
    </div>

    <div class="controls-main">
      <button class="ctrl" id="shuffle-btn" title="Shuffle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
      </button>
      <button class="ctrl" id="prev-btn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"/></svg>
      </button>
      <button class="play-pause" id="play-btn">
        <svg id="play-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <button class="ctrl" id="next-btn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"/></svg>
      </button>
      <button class="ctrl" id="repeat-btn" title="Repetir">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <span class="vol-label">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>
      </span>
      <input type="range" class="vol" id="vol" min="0" max="1" step="0.01" value="0.85">
      <span class="vol-label">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </span>
    </div>
  </div>

  <!-- Page: Queue -->
  <div class="page" id="page-queue">
    <div class="queue-header">
      <div class="queue-label">Lista de reproducción</div>
      <div class="queue-count" id="q-count">0 canciones</div>
    </div>

    <div class="queue-scroll" id="queue-list">
      <div class="empty">
        <div class="empty-icon">🎧</div>
        <div class="empty-title">Tu biblioteca está vacía</div>
        <div class="empty-sub">Sube tus MP3s y empieza<br>a escuchar tu música</div>
        <label class="upload-pill" for="file-input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Subir música
        </label>
      </div>
    </div>

    <label class="drop-zone" for="file-input" id="drop-zone" style="display:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:6px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Agregar más canciones
    </label>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active" data-page="player">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>
      Reproductor
    </div>
    <div class="nav-item" data-page="queue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Cola
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Hidden audio + file input -->
<audio id="audio"></audio>
<input type="file" id="file-input" accept="audio/*" multiple style="display:none">

<script>
// ── STATE ──
const state = {
  tracks: [],
  idx: 0,
  playing: false,
  shuffle: false,
  repeat: false,
  favs: new Set()
};

// ── ELEMENTS ──
const audio       = document.getElementById('audio');
const fileInput   = document.getElementById('file-input');
const playBtn     = document.getElementById('play-btn');
const playIcon    = document.getElementById('play-icon');
const prevBtn     = document.getElementById('prev-btn');
const nextBtn     = document.getElementById('next-btn');
const shuffleBtn  = document.getElementById('shuffle-btn');
const repeatBtn   = document.getElementById('repeat-btn');
const progTrack   = document.getElementById('prog-track');
const progFill    = document.getElementById('prog-fill');
const timeCur     = document.getElementById('time-cur');
const timeTot     = document.getElementById('time-tot');
const volSlider   = document.getElementById('vol');
const coverArt    = document.getElementById('cover-art');
const coverEmoji  = document.getElementById('cover-emoji');
const trackTitle  = document.getElementById('track-title');
const trackArtist = document.getElementById('track-artist');
const queueList   = document.getElementById('queue-list');
const qCount      = document.getElementById('q-count');
const favBtn      = document.getElementById('fav-btn');
const glow        = document.getElementById('glow');
const dropZone    = document.getElementById('drop-zone');
const toast       = document.getElementById('toast');

// ── COLORS / EMOJIS ──
const GRADIENTS = [
  '#6c2bd9,#a259ff','#0f2027,#2196f3','#1a0533,#e040fb',
  '#0d1b2a,#1b4332','#2d1b69,#11998e','#1a1a2e,#e94560',
  '#3a0ca3,#f72585','#023e8a,#48cae4','#6a040f,#f48c06',
  '#1b4332,#52b788'
];
const EMOJIS = ['🎵','🎶','🎸','🎹','🎷','🎺','🥁','🎻','🎙','🔊'];

function fmt(s) {
  if (!isFinite(s) || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

// ── TRACK LOADING ──
function loadTrack(idx, autoplay) {
  if (!state.tracks.length) return;
  state.idx = idx;
  const t = state.tracks[idx];
  audio.src = t.url;
  audio.volume = parseFloat(volSlider.value);

  const gi = idx % GRADIENTS.length;
  const g = GRADIENTS[gi].split(',');
  coverArt.style.background = `linear-gradient(135deg, ${g[0]}, ${g[1]})`;
  glow.style.background = g[1];
  coverEmoji.textContent = EMOJIS[idx % EMOJIS.length];
  trackTitle.textContent = t.name;
  trackArtist.textContent = t.artist || 'Artista desconocido';

  favBtn.textContent = state.favs.has(idx) ? '♥' : '♡';
  favBtn.classList.toggle('active', state.favs.has(idx));

  document.title = t.name + ' — Vibes';
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.name,
      artist: t.artist || 'Artista desconocido',
      album: 'Vibes',
    });
  }

  renderQueue();
  if (autoplay || state.playing) audio.play().catch(() => {});
}

// ── PLAY / PAUSE ──
function togglePlay() {
  if (!state.tracks.length) { showToast('Sube música primero'); return; }
  if (state.playing) audio.pause();
  else audio.play().catch(() => {});
}

function setPlayState(playing) {
  state.playing = playing;
  if (playing) {
    playIcon.innerHTML = '<rect x="5" y="4" width="4" height="16" rx="1"/><rect x="15" y="4" width="4" height="16" rx="1"/>';
    coverArt.classList.add('playing');
  } else {
    playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    coverArt.classList.remove('playing');
  }
  renderQueue();
}

// ── NEXT / PREV ──
function playNext() {
  if (!state.tracks.length) return;
  let next;
  if (state.shuffle) {
    do { next = Math.floor(Math.random() * state.tracks.length); }
    while (state.tracks.length > 1 && next === state.idx);
  } else {
    next = (state.idx + 1) % state.tracks.length;
  }
  loadTrack(next, true);
}

function playPrev() {
  if (!state.tracks.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  const prev = (state.idx - 1 + state.tracks.length) % state.tracks.length;
  loadTrack(prev, true);
}

// ── RENDER QUEUE ──
function renderQueue() {
  qCount.textContent = state.tracks.length + (state.tracks.length === 1 ? ' canción' : ' canciones');
  dropZone.style.display = state.tracks.length ? 'block' : 'none';

  if (!state.tracks.length) {
    queueList.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🎧</div>
        <div class="empty-title">Tu biblioteca está vacía</div>
        <div class="empty-sub">Sube tus MP3s y empieza<br>a escuchar tu música</div>
        <label class="upload-pill" for="file-input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Subir música
        </label>
      </div>`;
    return;
  }

  const gi_fn = i => { const g = GRADIENTS[i % GRADIENTS.length].split(','); return `linear-gradient(135deg,${g[0]},${g[1]})`; };

  queueList.innerHTML = state.tracks.map((t, i) => `
    <div class="track-row ${i === state.idx ? 'active' : ''}" onclick="onTrackClick(${i})">
      <div class="track-mini-art" style="background:${gi_fn(i)}">${EMOJIS[i % EMOJIS.length]}</div>
      <div class="track-row-info">
        <div class="track-row-name">${escHtml(t.name)}</div>
        <div class="track-row-meta">${escHtml(t.artist || 'Artista desconocido')} · ${t.duration || '--:--'}</div>
      </div>
      <div class="track-row-right">
        ${i === state.idx && state.playing
          ? '<div class="bars"><span></span><span></span><span></span></div>'
          : `<span class="track-dur">${t.duration || ''}</span>`}
      </div>
    </div>
  `).join('');
}

function onTrackClick(i) {
  if (i === state.idx) { togglePlay(); }
  else { loadTrack(i, true); switchPage('player'); }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── FILE INPUT ──
fileInput.addEventListener('change', e => {
  const files = Array.from(e.target.files).filter(f => f.type.startsWith('audio/'));
  if (!files.length) return;
  const wasEmpty = state.tracks.length === 0;
  let loaded = 0;

  files.forEach(f => {
    const url = URL.createObjectURL(f);
    const raw = f.name.replace(/\.[^/.]+$/, '');
    const parts = raw.split(' - ');
    const entry = {
      url,
      name: parts.length > 1 ? parts.slice(1).join(' - ').trim() : raw.trim(),
      artist: parts.length > 1 ? parts[0].trim() : '',
      duration: null
    };
    const tmp = new Audio(url);
    tmp.addEventListener('loadedmetadata', () => {
      entry.duration = fmt(tmp.duration);
      loaded++;
      if (loaded === files.length) {
        renderQueue();
        if (wasEmpty) loadTrack(0, true);
      }
    });
    tmp.addEventListener('error', () => {
      loaded++;
      if (loaded === files.length) { renderQueue(); if (wasEmpty) loadTrack(0, true); }
    });
    state.tracks.push(entry);
  });

  showToast(files.length + (files.length === 1 ? ' canción agregada' : ' canciones agregadas'));
  e.target.value = '';
});

// ── AUDIO EVENTS ──
audio.addEventListener('play', () => setPlayState(true));
audio.addEventListener('pause', () => setPlayState(false));
audio.addEventListener('ended', () => {
  if (state.repeat) { audio.currentTime = 0; audio.play(); }
  else playNext();
});

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progFill.style.width = pct + '%';
  timeCur.textContent = fmt(audio.currentTime);
  timeTot.textContent = fmt(audio.duration);
});

audio.addEventListener('loadedmetadata', () => {
  timeTot.textContent = fmt(audio.duration);
});

// ── PROGRESS SCRUB (touch + mouse) ──
let scrubbing = false;

function scrubTo(clientX) {
  const rect = progTrack.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  if (audio.duration) audio.currentTime = pct * audio.duration;
  progFill.style.width = (pct * 100) + '%';
}

progTrack.addEventListener('mousedown', e => { scrubbing = true; progTrack.classList.add('dragging'); scrubTo(e.clientX); });
document.addEventListener('mousemove', e => { if (scrubbing) scrubTo(e.clientX); });
document.addEventListener('mouseup', () => { scrubbing = false; progTrack.classList.remove('dragging'); });

progTrack.addEventListener('touchstart', e => { scrubbing = true; progTrack.classList.add('dragging'); scrubTo(e.touches[0].clientX); }, { passive: true });
document.addEventListener('touchmove', e => { if (scrubbing) scrubTo(e.touches[0].clientX); }, { passive: true });
document.addEventListener('touchend', () => { scrubbing = false; progTrack.classList.remove('dragging'); });

// ── CONTROLS ──
playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', playPrev);
nextBtn.addEventListener('click', playNext);

shuffleBtn.addEventListener('click', () => {
  state.shuffle = !state.shuffle;
  shuffleBtn.classList.toggle('on', state.shuffle);
  showToast(state.shuffle ? 'Shuffle activado' : 'Shuffle desactivado');
});

repeatBtn.addEventListener('click', () => {
  state.repeat = !state.repeat;
  repeatBtn.classList.toggle('on', state.repeat);
  showToast(state.repeat ? 'Repetir activado' : 'Repetir desactivado');
});

favBtn.addEventListener('click', () => {
  if (!state.tracks.length) return;
  if (state.favs.has(state.idx)) {
    state.favs.delete(state.idx);
    favBtn.textContent = '♡';
    favBtn.classList.remove('active');
    showToast('Eliminado de favoritos');
  } else {
    state.favs.add(state.idx);
    favBtn.textContent = '♥';
    favBtn.classList.add('active');
    showToast('Agregado a favoritos');
  }
});

volSlider.addEventListener('input', () => { audio.volume = parseFloat(volSlider.value); });

// ── KEYBOARD SHORTCUTS ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); }
  if (e.code === 'ArrowLeft')  { audio.currentTime = Math.max(0, audio.currentTime - 10); }
  if (e.code === 'ArrowUp')    { volSlider.value = Math.min(1, parseFloat(volSlider.value) + 0.05); audio.volume = parseFloat(volSlider.value); }
  if (e.code === 'ArrowDown')  { volSlider.value = Math.max(0, parseFloat(volSlider.value) - 0.05); audio.volume = parseFloat(volSlider.value); }
  if (e.code === 'KeyN') playNext();
  if (e.code === 'KeyP') playPrev();
});

// Media Session API
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', playNext);
  navigator.mediaSession.setActionHandler('previoustrack', playPrev);
  navigator.mediaSession.setActionHandler('seekto', d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
}

// ── TABS / NAV ──
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelector(`.tab[data-page="${name}"]`).classList.add('active');
  document.querySelector(`.nav-item[data-page="${name}"]`).classList.add('active');
}

document.querySelectorAll('.tab, .nav-item').forEach(el => {
  el.addEventListener('click', () => switchPage(el.dataset.page));
});

// ── DRAG & DROP ──
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));
  if (!files.length) return;
  const dt = new DataTransfer();
  files.forEach(f => dt.items.add(f));
  fileInput.files = dt.files;
  fileInput.dispatchEvent(new Event('change'));
});

// ── PWA INSTALL ──
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});

document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') showToast('¡Vibes instalado!');
  deferredPrompt = null;
  document.getElementById('install-banner').classList.remove('show');
});

document.getElementById('banner-close').addEventListener('click', () => {
  document.getElementById('install-banner').classList.remove('show');
});

// ── PWA MANIFEST (inline) ──
const manifest = {
  name: 'Vibes — Music Player',
  short_name: 'Vibes',
  description: 'Tu reproductor de música personal',
  start_url: '.',
  display: 'standalone',
  background_color: '#080810',
  theme_color: '#0a0a0f',
  orientation: 'portrait',
  icons: [
    { src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="100" fill="%230a0a0f"/><text y="340" x="90" font-size="320">🎵</text></svg>', sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
  ]
};
const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
const manifestURL = URL.createObjectURL(blob);
const link = document.createElement('link');
link.rel = 'manifest';
link.href = manifestURL;
document.head.appendChild(link);

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'vibes-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', './index.html'])).catch(()=>{}));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch', e => {
      if (e.request.url.startsWith('blob:')) return;
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() => new Response('offline'))));
    });
  `;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swURL = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swURL).catch(() => {});
}
</script>
</body>
</html>
